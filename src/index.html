<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Takaful Stone Concept</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
@font-face { font-family: Inter; font-weight: 700; src: url(/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2); }
@font-face { font-family: Inter; font-weight: 800; src: url(/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2); }
:root {
  --blue: #3b8cff; --cyan: #7fd4ff; --ice: #e9f3ff; --navy: #031026;
  --glass: rgba(255,255,255,0.10); --glass-b: rgba(255,255,255,0.28);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 868px; overflow: hidden; background: var(--navy); font-family: Inter, sans-serif; color: #fff; }
#bg { position: absolute; inset: 0; }
#bg .g { position: absolute; inset: 0;
  background: radial-gradient(80% 90% at 66% 45%, #1a4fb8 0%, #0b2a6b 38%, #05153a 70%, #020b1f 100%); }
#bg .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
#bg .grid { position: absolute; left: -20%; right: -20%; bottom: -10%; height: 55%;
  background-image: linear-gradient(rgba(127,212,255,.16) 2px, transparent 2px), linear-gradient(90deg, rgba(127,212,255,.16) 2px, transparent 2px);
  background-size: 70px 70px; transform: perspective(500px) rotateX(62deg); transform-origin: 50% 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 70%, transparent 100%); }
#bg .vignette { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 45%, transparent 55%, rgba(0,4,16,.65) 100%); }
canvas#gl { position: absolute; inset: 0; width: 1280px; height: 868px; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.abs { position: absolute; will-change: transform, opacity; }

/* header */
#brand { left: 60px; top: 44px; height: 40px; padding: 0 18px 0 10px; border-radius: 20px; display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 1.5px solid var(--glass-b); backdrop-filter: blur(18px); font-weight: 700; font-size: 16px; letter-spacing: .18em; }
#brand .dot { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #8fc6ff 45%, #2a6bff 100%); box-shadow: 0 0 18px #4aa3ff; }
#headline { left: 60px; width: 520px; top: 110px; height: 150px; }
#headline .h { position: absolute; left: 0; top: 0; width: 100%; font-weight: 800; font-size: 50px; line-height: 1.06; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #ffffff 0%, #dbe7f7 55%, #9fb4cf 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
#headline .k { position: absolute; left: 2px; top: -2px; font-size: 17px; font-weight: 600; color: var(--cyan); letter-spacing: .04em; }
#headline .h span { display: block; padding-top: 28px; }

/* glass card */
.card { background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); border: 1.5px solid rgba(255,255,255,.32);
  backdrop-filter: blur(22px) saturate(140%); border-radius: 32px; box-shadow: 0 30px 60px rgba(0,8,30,.45), inset 0 1px 0 rgba(255,255,255,.4); }
.chip { display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 9px; border-radius: 999px; font-weight: 700; font-size: 21px; white-space: nowrap;
  background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.08)); border: 1.5px solid rgba(255,255,255,.38);
  backdrop-filter: blur(16px); box-shadow: 0 16px 36px rgba(0,8,30,.4); transform-origin: 50% 50%; }
.chip .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #5aa8ff, #1f5fe0); box-shadow: 0 0 16px rgba(80,160,255,.8); }
.chip .ic svg { width: 20px; height: 20px; }
.chip.warn .ic { background: linear-gradient(135deg, #dbe6f5, #7d8ea8); box-shadow: 0 0 14px rgba(200,220,255,.6); }
.tag { padding: 5px 13px; border-radius: 999px; font-weight: 700; font-size: 16px; background: rgba(5,25,70,.55); border: 1.5px solid rgba(127,212,255,.6);
  backdrop-filter: blur(10px); white-space: nowrap; transform: translate(-50%, -50%); }

/* subtitles */
#subs { left: 140px; width: 1000px; top: 726px; height: 120px; display: flex; align-items: center; justify-content: center; }
#subs .line { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 12px; padding: 12px 28px; border-radius: 22px;
  background: rgba(4,18,52,.42); border: 1.5px solid rgba(255,255,255,.18); backdrop-filter: blur(16px); }
#subs .w { margin: 0 2px; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; line-height: 1.12; display: inline-block; transform-origin: 50% 60%; text-shadow: 0 4px 18px rgba(0,10,40,.5); }
#subs .w.key { background: linear-gradient(180deg, #bfe9ff, #4fa2ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 14px rgba(80,170,255,.55)); }

/* infographic */
#bar { left: 60px; width: 480px; top: 300px; padding: 20px 24px 22px; }
#bar .t { font-size: 16px; font-weight: 700; letter-spacing: .12em; color: var(--cyan); }
#bar .track { margin-top: 12px; height: 20px; border-radius: 10px; background: rgba(255,255,255,.12); overflow: hidden; display: flex; }
#bar .seg { height: 100%; width: 0; }
#bar .legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 16px; font-weight: 600; color: #dce9fb; }
#bar .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; }
#ecg { left: 60px; width: 460px; top: 380px; height: 104px; padding: 14px 22px; display: flex; align-items: center; gap: 20px; }
#ecg svg { flex: 1; height: 100%; }
#ecg .bpm { font-size: 16px; font-weight: 700; color: var(--cyan); letter-spacing: .1em; line-height: 1.3; }

/* end card */
#end { left: 60px; width: 540px; top: 150px; padding: 36px 34px 34px; text-align: left; }
#end .k { font-size: 17px; font-weight: 700; letter-spacing: .22em; color: var(--cyan); }
#end .h { margin-top: 10px; font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.0;
  background: linear-gradient(180deg, #fff, #b8cbe3); -webkit-background-clip: text; background-clip: text; color: transparent; }
#end .s { margin-top: 16px; font-size: 24px; font-weight: 600; color: #dce9fb; line-height: 1.3; }
#end .row { margin-top: 24px; display: flex; gap: 10px; }
#end .row div { padding: 8px 16px; border-radius: 999px; font-size: 18px; font-weight: 700; background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.3); }

#flash { inset: 0; background: radial-gradient(40% 55% at 66% 48%, rgba(190,230,255,.9), rgba(120,180,255,.0) 70%); opacity: 0; }
#guides { position: absolute; inset: 0; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="bg"><div class="g"></div>
  <div class="blob" id="b1" style="width:600px;height:600px;background:#2f7bff;left:500px;top:100px"></div>
  <div class="blob" id="b2" style="width:420px;height:420px;background:#64c8ff;right:-120px;top:420px;opacity:.35"></div>
  <div class="blob" id="b3" style="width:420px;height:420px;background:#c9dcff;left:-120px;top:-160px;opacity:.18"></div>
  <div class="grid" id="grid"></div><div class="vignette"></div></div>
<canvas id="gl" width="1280" height="868"></canvas>
<div id="ui">
  <div id="flash" class="abs"></div>
  <div id="brand" class="abs"><div class="dot"></div>STONE CONCEPT</div>
  <div id="headline" class="abs"></div>
  <div id="labels"></div>
  <div id="bar" class="abs card">
    <div class="t">KOMITMEN BULANAN</div>
    <div class="track"></div>
    <div class="legend"></div>
  </div>
  <div id="ecg" class="abs card">
    <svg viewBox="0 0 400 100" preserveAspectRatio="none"><path id="ecgp" d="" fill="none" stroke="#7fd4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="bpm">KOS<br>PERUBATAN</div>
  </div>
  <div id="chips"></div>
  <div id="subs" class="abs"></div>
  <div id="end" class="abs card">
    <div class="k">PERLINDUNGAN</div>
    <div class="h">Takaful<br>Protection</div>
    <div class="s">Tembok yang menahan beban komitmen daripada menimpa keluarga.</div>
    <div class="row"><div>Hibah</div><div>Sakit Kritikal</div><div>Medical Card</div></div>
  </div>
</div>

<script type="module" src="/src/scene.js"></script>
</body>
</html>
